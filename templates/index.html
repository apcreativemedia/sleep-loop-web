<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleep Loop Web</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #131a33;
      --fg: #e8ecf4;
      --muted: #8892b0;
      --accent: #7aa2ff;
      --accent2: #4cc9a0;
      --border: #223055;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at top, #1a2550, #0b1020 60%);
      color: var(--fg);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 2rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); margin: 0 0 2rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    h2 { font-size: 1.15rem; margin: 0 0 1rem; }
    .trending-list { display: flex; flex-direction: column; gap: .5rem; }
    .trend-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: .7rem .9rem; background: #0d1430;
      border: 1px solid var(--border); border-radius: 9px; gap: .75rem;
    }
    .trend-item a { color: var(--accent); text-decoration: none; font-size: .95rem; word-break: break-word; }
    .source-tag {
      font-size: .7rem; padding: 2px 8px; border-radius: 10px;
      background: var(--border); color: var(--muted); white-space: nowrap;
    }
    form label { display: block; margin-bottom: .5rem; color: var(--muted); font-size: .9rem; }
    input[type=file], input[type=text], input[type=number] {
      width: 100%; padding: .7rem; background: #0d1430; color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px;
      font: inherit; margin-bottom: 1rem;
    }
    .radio-row { display: flex; gap: .6rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .radio-pill {
      flex: 1; min-width: 90px; padding: .7rem .4rem;
      background: #0d1430; border: 1px solid var(--border); border-radius: 10px;
      text-align: center; cursor: pointer; transition: .15s; font-size: .9rem;
    }
    .radio-pill input { display: none; }
    .radio-pill:has(input:checked) {
      border-color: var(--accent); background: rgba(122,162,255,0.14);
    }
    .custom-dur-wrap { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; }
    .custom-dur-wrap input { margin-bottom: 0; }
    button {
      width: 100%; padding: .9rem; background: var(--accent); color: #0b1020;
      border: 0; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .jobs { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .job {
      background: #0d1430; border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem;
    }
    .job-label { font-weight: 600; margin-bottom: .5rem; word-break: break-word; }
    .bar-outer { height: 8px; background: #0b1020; border-radius: 4px; overflow: hidden; }
    .bar-inner { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; transition: width .5s; }
    .status-text { color: var(--muted); font-size: .85rem; margin-top: .4rem; }
    .download-btn {
      display: block; margin-top: .6rem; background: var(--accent2);
      text-align: center; padding: .7rem; color: #0b1020;
      border-radius: 8px; text-decoration: none; font-weight: 700; font-size: .9rem;
    }
    .download-btn.secondary { background: var(--border); color: var(--fg); }
    .error-msg {
      color: #ff7a7a; background: rgba(255,122,122,0.1);
      border: 1px solid rgba(255,122,122,0.3); padding: .7rem;
      border-radius: 8px; margin-top: .5rem; font-size: .85rem;
    }
    .loading { color: var(--muted); font-style: italic; }
    .hint { color: var(--muted); font-size: .8rem; margin-top: -.5rem; margin-bottom: 1rem; }
    .mode-row { display: flex; gap: .6rem; margin-bottom: 1rem; }
    .mode-pill {
      flex: 1; padding: .7rem; background: #0d1430;
      border: 1px solid var(--border); border-radius: 10px;
      text-align: center; cursor: pointer; font-size: .9rem;
    }
    .mode-pill input { display: none; }
    .mode-pill:has(input:checked) {
      border-color: var(--accent2); background: rgba(76,201,160,0.12);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🌙 Sleep Loop</h1>
    <p class="sub">Convierte cualquier audio en un loop perfecto de la duración que quieras.</p>

    <div class="card">
      <h2>🔥 Lo más buscado hoy</h2>
      <div id="trending" class="trending-list">
        <div class="loading">Cargando tendencias…</div>
      </div>
    </div>

    <div class="card">
      <h2>🎵 Subir audio(s) y convertir a loop</h2>
      <form id="form">
        <label>Archivos de audio (uno o varios)</label>
        <input type="file" name="audio" accept="audio/*,video/mp4" multiple required>
        <p class="hint">Podés subir varios a la vez. Elegí abajo si querés loops separados o mezclar todo en uno.</p>

        <label>Modo</label>
        <div class="mode-row">
          <label class="mode-pill">
            <input type="radio" name="mode" value="separate" checked>
            <strong>🎧 Separados</strong><br><small style="color:var(--muted)">1 loop por archivo</small>
          </label>
          <label class="mode-pill">
            <input type="radio" name="mode" value="mix">
            <strong>🎛️ Mezclar</strong><br><small style="color:var(--muted)">todos en un solo loop</small>
          </label>
        </div>

        <label>Nombre (opcional)</label>
        <input type="text" name="title" placeholder="gentle stream, rain on tent, etc.">

        <label>Duración</label>
        <div class="radio-row">
          <label class="radio-pill"><input type="radio" name="duration_preset" value="30">30 min</label>
          <label class="radio-pill"><input type="radio" name="duration_preset" value="60" checked>1 h</label>
          <label class="radio-pill"><input type="radio" name="duration_preset" value="120">2 h</label>
          <label class="radio-pill"><input type="radio" name="duration_preset" value="180">3 h</label>
          <label class="radio-pill"><input type="radio" name="duration_preset" value="480">8 h</label>
          <label class="radio-pill"><input type="radio" name="duration_preset" value="custom">Custom</label>
        </div>
        <div class="custom-dur-wrap" id="customDurWrap" style="display:none">
          <input type="number" id="customDurMin" name="custom_dur_min" min="10" max="720" placeholder="minutos (10–720)">
          <span style="color:var(--muted);white-space:nowrap">min</span>
        </div>

        <button type="submit" id="submitBtn">Generar loop(s)</button>

        <div id="jobsContainer" class="jobs"></div>
      </form>
    </div>
  </div>

<script>
async function loadTrending() {
  try {
    const r = await fetch("/api/trending");
    const data = await r.json();
    const el = document.getElementById("trending");
    if (!data.length) { el.innerHTML = '<div class="loading">Sin tendencias disponibles</div>'; return; }
    el.innerHTML = data.map(item => `
      <div class="trend-item">
        <a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.topic)}</a>
        <span class="source-tag">${escapeHtml(item.source)}</span>
      </div>
    `).join("");
  } catch (e) {
    document.getElementById("trending").innerHTML = '<div class="loading">Error cargando tendencias</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.querySelectorAll('input[name="duration_preset"]').forEach(r => {
  r.addEventListener('change', () => {
    document.getElementById('customDurWrap').style.display = r.value === 'custom' ? 'flex' : 'none';
  });
});

let audioCtx = null;
function primeAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function playDoneChime() {
  if (!audioCtx) return;
  const notes = [523.25, 659.25, 783.99];
  const start = audioCtx.currentTime + 0.05;
  for (let r = 0; r < 2; r++) {
    const base = start + r * 1.5;
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g); g.connect(audioCtx.destination);
      const t0 = base + i * 0.18;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.25, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
      o.start(t0); o.stop(t0 + 0.55);
    });
  }
}
function flashTitle() {
  const orig = document.title;
  let on = true;
  const flash = setInterval(() => {
    document.title = on ? "🎉 ¡Loop listo!" : orig;
    on = !on;
  }, 800);
  const stop = () => { clearInterval(flash); document.title = orig; window.removeEventListener('focus', stop); };
  window.addEventListener('focus', stop);
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  primeAudio();

  const form = e.target;
  const btn = document.getElementById("submitBtn");
  const jobsContainer = document.getElementById("jobsContainer");

  const preset = form.querySelector('input[name="duration_preset"]:checked').value;
  let duration_min;
  if (preset === 'custom') {
    duration_min = parseInt(document.getElementById('customDurMin').value);
    if (!duration_min || duration_min < 10 || duration_min > 720) {
      alert("Ingresá una duración custom entre 10 y 720 minutos.");
      return;
    }
  } else {
    duration_min = parseInt(preset);
  }

  btn.disabled = true;
  jobsContainer.innerHTML = "";

  const fd = new FormData(form);
  fd.delete("duration_preset");
  fd.delete("custom_dur_min");
  fd.set("duration_min", String(duration_min));

  try {
    const r = await fetch("/api/render", { method: "POST", body: fd });
    const data = await r.json();
    if (data.error) {
      jobsContainer.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
      btn.disabled = false;
      return;
    }
    const jobs = data.jobs || [];
    jobs.forEach(j => addJobUI(j.job_id, j.label));
    let remaining = jobs.length;
    jobs.forEach(j => pollStatus(j.job_id, () => {
      remaining--;
      if (remaining <= 0) {
        btn.disabled = false;
        playDoneChime();
        if (!document.hasFocus()) flashTitle();
      }
    }));
  } catch (err) {
    jobsContainer.innerHTML = `<div class="error-msg">Error: ${escapeHtml(err.message)}</div>`;
    btn.disabled = false;
  }
});

function addJobUI(jobId, label) {
  const container = document.getElementById("jobsContainer");
  const div = document.createElement("div");
  div.className = "job";
  div.id = `job-${jobId}`;
  div.innerHTML = `
    <div class="job-label">${escapeHtml(label || jobId)}</div>
    <div class="bar-outer"><div class="bar-inner" id="bar-${jobId}"></div></div>
    <div class="status-text" id="status-${jobId}">Iniciando…</div>
    <div id="dl-${jobId}"></div>
  `;
  container.appendChild(div);
}

async function pollStatus(jobId, onDone) {
  const bar = document.getElementById(`bar-${jobId}`);
  const status = document.getElementById(`status-${jobId}`);
  const dl = document.getElementById(`dl-${jobId}`);

  const tick = async () => {
    try {
      const r = await fetch(`/api/status/${jobId}`);
      const data = await r.json();
      bar.style.width = (data.progress || 0) + "%";
      status.textContent = data.status + " — " + (data.progress || 0) + "%";
      if (data.error) {
        status.innerHTML = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
        if (onDone) onDone();
        return;
      }
      if (data.done) {
        status.textContent = "¡Listo! 🎉";
        let cutsHtml = "";
        if (data.wrap_cuts && data.wrap_cuts.length) {
          cutsHtml = `<div style="margin-top:.6rem;padding:.7rem;background:#0b1020;border:1px solid var(--border);border-radius:8px;font-size:.8rem">
            <strong>WRAP crossfades</strong> (qsin 20s, entre sealed units):<br>
            <span style="color:var(--accent2);font-family:monospace;font-size:.85rem">${data.wrap_cuts.join(" · ")}</span>
            <br><small style="color:var(--muted)">+ ${data.internal_cuts_count} internal crossfades (qsin 8s)</small>
          </div>`;
        } else {
          cutsHtml = `<div style="margin-top:.6rem;padding:.6rem;background:#0b1020;border:1px solid var(--border);border-radius:8px;font-size:.8rem;color:var(--muted)">
            Sin WRAP cuts — cabe en un solo sealed unit. ${data.internal_cuts_count} internal crossfades.
          </div>`;
        }
        dl.innerHTML = `
          <a class="download-btn" href="/download/${jobId}">⬇ Descargar MP3</a>
          <a class="download-btn secondary" href="/cuts/${jobId}">📄 Lista de cortes (.txt)</a>
          ${cutsHtml}`;
        if (onDone) onDone();
        return;
      }
      setTimeout(tick, 2000);
    } catch (e) {
      status.textContent = "Error polling: " + e.message;
      if (onDone) onDone();
    }
  };
  tick();
}

loadTrending();
</script>
</body>
</html>
